            padding: 20px;
            color: #eee;
        }
        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 40px;
            font-weight: 800;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background: #1a1a1a;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
        }
        .card-content {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #222;
        }
        .org-name {
            font-size: 1.1em;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
        }
        .org-name:hover {
            color: #0088cc;
            text-decoration: underline;
        }
        .skins-list {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .skin-item {
            text-align: center;
            background: #111;
            padding: 10px;
            border-radius: 15px;
        }
        .skin-img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 8px;
        }
        .skin-price {
            display: block;
            color: #00ff88;
            font-weight: bold;
            font-size: 0.9em;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: #333;
            border-radius: 20px;
            font-size: 0.8em;
            margin-bottom: 10px;
            color: #aaa;
        }
        .footer {
            text-align: center;
            margin-top: 60px;
            padding: 40px;
            color: #555;
            font-size: 0.9em;
        }
    </style>
